{% load i18n %}{% comment %}
Liste déroulante de filtre. name, label, options ; current : valeur choisie ;
by_pk : la valeur est la clé primaire (sinon le slug).
{% endcomment %}
<div>
  <label for="id_{{ name }}" class="block text-sm font-medium text-stone-800">{{ label }}</label>
  <select name="{{ name }}" id="id_{{ name }}" class="mt-1 block w-full rounded border border-stone-300 bg-white px-3 py-2">
    <option value="">{% translate "All" %}</option>
    {% for option in options %}
      {% if by_pk %}
        <option value="{{ option.pk }}" {% if option.pk|stringformat:"s" == current %}selected{% endif %}>{{ option }}</option>
      {% else %}
        <option value="{{ option.slug }}" {% if option.slug == current %}selected{% endif %}>{{ option }}</option>
      {% endif %}
    {% endfor %}
  </select>
</div>
