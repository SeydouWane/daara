{% load i18n %}
<header class="border-b border-stone-200 bg-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4">
    <a href="{% url 'core:home' %}" class="text-2xl sm:text-3xl" aria-label="{% translate 'DAARA home page' %}">
      {% include "components/logo.html" with compact=True %}
    </a>
    <div class="flex items-center gap-2 text-sm">
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard:home' %}" class="rounded px-3 py-1.5 font-medium text-brand-800 hover:bg-brand-50">{% translate "My space" %}</a>
        <form method="post" action="{% url 'members:logout' %}">
          {% csrf_token %}
          <button type="submit" class="rounded px-3 py-1.5 text-stone-700 hover:bg-stone-100">{% translate "Sign out" %}</button>
        </form>
      {% else %}
        <a href="{% url 'members:login' %}" class="rounded px-3 py-1.5 font-medium text-brand-800 hover:bg-brand-50">{% translate "Sign in" %}</a>
      {% endif %}
      <nav aria-label="{% translate 'Language' %}">
        {% include "components/language_switcher.html" %}
      </nav>
    </div>
  </div>
</header>
