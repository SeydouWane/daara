# Environnement de développement : `docker compose up`, puis http://localhost:8000
name: daara

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daara
      POSTGRES_USER: daara
      POSTGRES_PASSWORD: daara
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daara -d daara"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  # Recompile Tailwind à chaque modification ; node_modules reste dans un volume Docker.
  assets:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && sh scripts/watch-assets.sh"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  web:
    build:
      context: .
      target: dev
    command: >
      sh -c "python manage.py compilemessages --ignore=node_modules
      && python manage.py migrate
      && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://daara:daara@db:5432/daara
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  node_modules:
